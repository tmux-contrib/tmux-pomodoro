[package]
name = "tmux-pomodoro"
version = "0.7.0"
edition = "2021"
description = "A Pomodoro timer CLI that persists sessions in SQLite, with a tmux status-bar plugin"
license = "MIT"
documentation = "https://github.com/tmux-contrib/tmux-pomodoro"
homepage = "https://github.com/tmux-contrib/tmux-pomodoro"
repository = "https://github.com/tmux-contrib/tmux-pomodoro"
readme = "README.md"
keywords = ["pomodoro", "timer", "tmux", "cli", "productivity"]
categories = ["command-line-utilities"]
# The tmux plugin (main.tmux, scripts/) is installed from git, not from crates.io
include = ["/src", "/tests/*.rs", "/CHANGELOG.md", "/LICENSE", "/README.md"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
humantime = "2.3.0"
xdg = "3.0.0"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
regex = "1.12.3"
uuid = { version = "1.23.1", features = ["serde", "v7"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = { version = "2", features = ["builtins"] }
toml = "1.1.2"
humantime-serde = "1.1.1"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
